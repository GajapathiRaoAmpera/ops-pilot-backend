services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot   # local dev only
      POSTGRES_DB: opspilot
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      OPSPILOT_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@db:5432/opspilot
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
